name: Update Mortgage Rates

on:
  schedule:
    - cron: '15 19 * * 4'
  workflow_dispatch:

jobs:
  update-rates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      - name: Run Rate Update Script
        run: python scripts/update_rates.py

      - name: Commit Updated Rate File
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add BaseRateAll.csv
          git diff --staged --quiet || git commit -m "Auto update mortgage rates"
          git push
