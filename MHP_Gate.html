<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opening Estimator…</title>

<style>
  body{
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:#f6f7f8;
    color:#222;
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
    margin:0;
  }
  .card{
    background:#fff;
    border:1px solid #ddd;
    border-radius:6px;
    padding:24px 28px;
    max-width:420px;
    text-align:center;
  }
  .title{
    font-size:20px;
    font-weight:600;
    margin-bottom:12px;
  }
  .msg{
    font-size:14px;
    color:#555;
  }
  .error{
    color:#c92c2c;
    font-weight:600;
  }
</style>
</head>

<body>
<div class="card">
  <div class="title">Opening Estimator…</div>
  <div id="msg" class="msg">Please wait, this will only take a moment.</div>
</div>

<script>
"use strict";

/* ================= CONFIG ================= */
const KEY_CSV_URL =
  "https://raw.githubusercontent.com/Harlow1420/MHP-Estimator/refs/heads/main/MHP_Key_Master.csv";

const REDIRECT_URL = "https://hp-estimator.com/live";

/* ================= HELPERS ================= */
function qs(name){
  return new URLSearchParams(window.location.search).get(name);
}

function parseCSV(text){
  const lines = text.trim().split(/\r?\n/);
  const headers = lines[0].split(",").map(h => h.trim());

  return lines.slice(1).map(line => {
    const cols = line.split(",");
    const row = {};
    headers.forEach((h,i) => row[h] = (cols[i] || "").trim());
    return row;
  });
}

function showError(msg){
  const el = document.getElementById("msg");
  el.textContent = msg;
  el.className = "msg error";
}

/* ================= MAIN ================= */
(async function(){
  const key = qs("key");

  if(!key){
    showError("This access link is missing or invalid.");
    return;
  }

  try{
    const res = await fetch(KEY_CSV_URL, { cache:"no-store" });
    if(!res.ok) throw new Error("CSV fetch failed");

    const csvText = await res.text();
    const rows = parseCSV(csvText);

    const row = rows.find(r => r.key === key);

    if(!row){
      showError("This access link is missing or invalid.");
      return;
    }

    const today = new Date();
    const start = new Date(row.start_date + "T00:00:00");
    const end   = new Date(row.end_date   + "T23:59:59");

    if(today < start || today > end){
      showError("This access link is no longer available.");
      return;
    }

    /* SUCCESS */
    document.getElementById("msg").textContent =
      "Access verified. Opening estimator…";

    setTimeout(() => {
      window.location.href = REDIRECT_URL;
    }, 900);

  }catch(err){
    console.error(err);
    showError("Unable to verify access at this time.");
  }
})();
</script>
</body>
</html>
