<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MHP Estimator V17.8</title>

<style>
body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f6f7f8;color:#222;margin:0;padding:30px 0;
}
.container{max-width:1050px;margin:0 auto;padding:0 20px}

/* HEADER */
.header-container{display:flex;flex-direction:column;margin-bottom:20px}
.header-left{text-align:left;font-size:28px;font-weight:700}
.header-center{text-align:center;font-size:18px;font-style:italic}
.header-right{text-align:right;font-size:13px;font-weight:500}

h2{font-size:18px;border-bottom:1px solid #ddd;padding-bottom:6px}
.card{background:#fff;border:1px solid #ddd;border-radius:6px;padding:18px 20px;margin-bottom:20px}
.card.inputs{background:#ADD8E6}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.subgrid{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:16px}
label{font-size:13px;font-weight:600;margin-bottom:6px;display:block}
input,select,button{width:100%;padding:8px 10px;font-size:14px}
button{background:#1f4fd8;color:#fff;border:none;border-radius:4px;cursor:pointer}
button:hover{background:#183fb0}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid #eee}
.right{text-align:right}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.highlight{font-size:32px;font-weight:700;margin:10px 0}
.pos{color:#1a7f37;font-weight:600}
.neg{color:#c92c2c;font-weight:600}
.disclaimer{font-size:12px;color:#666;text-align:center;margin-top:30px}

.rate-table th,.rate-table td{width:33.33%;text-align:center}
@media(max-width:600px){.subgrid{grid-template-columns:1fr}}
</style>
</head>

<body>
<div class="container">

  <div class="header-container">
    <div class="header-left">Maximum Home Price Estimator</div>
    <div class="header-center">a tool for thought</div>
    <div class="header-right">MHP-Estimator ©2025</div>
  </div>

  <div class="card inputs">
    <h2>User Inputs</h2>
    <div class="grid">
      <div>
        <label>Maximum Monthly Housing Payment</label>
        <input id="maxPayment" value="4,000">
      </div>
      <div>
        <label>Maximum Funds Available to Use</label>
        <input id="maxCash" value="100,000">
      </div>
      <div class="subgrid">
        <div>
          <label>State</label>
          <select id="state"></select>
        </div>
        <div>
          <label>County</label>
          <select id="county"></select>
        </div>
      </div>
    </div>
    <br>
    <button onclick="runCalculator()">Run Estimation</button>
  </div>

  <div id="output"></div>
  <div class="disclaimer">For entertainment purposes only</div>

</div>

<script>
"use strict";

const state=document.getElementById("state");
const county=document.getElementById("county");
const output=document.getElementById("output");

const BASE_RATE=0.0615, TERM=360, MIN_DP=0.05;
const LBPMI=0.0034, HBPMI=0.0115;
const RATE_STEP=0.00125;

const CSV_URL="https://raw.githubusercontent.com/Harlow1420/MHP-Estimator/main/EPTRBC.csv";
let COUNTY_DATA={}, ACTIVE_FACTORS=null;

function num(id){return Number(document.getElementById(id).value.replace(/,/g,""))||0}
["maxPayment","maxCash"].forEach(id=>{
  const e=document.getElementById(id);
  e.onfocus=()=>e.value=e.value.replace(/,/g,"");
  e.onblur=()=>e.value=Number(e.value).toLocaleString();
});

async function loadCSV(){
  const t=await (await fetch(CSV_URL)).text();
  t.trim().split("\n").slice(1).forEach(r=>{
    const [s,c,tax,cc,cov,hoi]=r.split(",");
    COUNTY_DATA[s]??={};
    COUNTY_DATA[s][c]={tax:+tax,cc:+cc,hoiBaseCoverage:+cov,hoiBaseAnnual:+hoi};
  });
  populateStates();
}

function populateStates(){
  state.innerHTML="";
  Object.keys(COUNTY_DATA).sort().forEach(s=>state.add(new Option(s,s)));
  state.value="Michigan";
  populateCounties();
}
function populateCounties(){
  county.innerHTML="";
  Object.keys(COUNTY_DATA[state.value]).sort().forEach(c=>county.add(new Option(c,c)));
  county.value="Oakland County";
  ACTIVE_FACTORS=COUNTY_DATA[state.value][county.value];
}
state.onchange=populateCounties;
county.onchange=()=>ACTIVE_FACTORS=COUNTY_DATA[state.value][county.value];

function calc(rate,maxPmt,maxCash){
  if(!ACTIVE_FACTORS) return null;
  const r=rate/12;
  const PIF=(r*Math.pow(1+r,TERM))/(Math.pow(1+r,TERM)-1);
  let hp=50000,last=null;

  while(true){
    const cc=hp*ACTIVE_FACTORS.cc;
    const dp=maxCash-cc;
    if(dp<hp*MIN_DP) break;

    const la=hp-dp, ltv=la/hp;
    const pi=la*PIF;
    const tax=(hp*ACTIVE_FACTORS.tax)/12;
    const cov=Math.max(la,0.8*hp);
    const hoi=(ACTIVE_FACTORS.hoiBaseAnnual*(cov/ACTIVE_FACTORS.hoiBaseCoverage))/12;

    let pmi=0,pmiF=0;
    if(ltv>0.8){
      pmiF=ltv>=0.95?HBPMI:LBPMI+(HBPMI-LBPMI)*(ltv-0.8001)/(0.95-0.8001);
      pmi=(la*pmiF)/12;
    }

    const pmt=pi+tax+hoi+pmi;
    if(pmt<=maxPmt && dp+cc<=maxCash){
      last={hp,la,dp,cc,ltv,pi,tax,hoi,pmi,pmt,pmiF,cov};
      hp+=1000;
    } else break;
  }
  return last;
}

function runCalculator(){
  const base=calc(BASE_RATE,num("maxPayment"),num("maxCash"));
  if(!base) return;

  output.innerHTML=`<div class="card">
    <div class="highlight">Maximum Home Price ≈ $${base.hp.toLocaleString()}</div>
  </div>`;
}

loadCSV().then(runCalculator);
</script>
</body>
</html>
