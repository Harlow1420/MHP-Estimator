<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Price Estimator V40</title>
 
<style>
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f6f7f8;
  color: #222;
  margin: 0;
  padding: 30px 0;
}
 
.container { max-width:1050px; margin:0 auto; padding:0 20px; }
 
/* ---------- 3-ROW HEADER ---------- */
.header-container {
  display: grid;
  grid-template-rows: auto auto auto;
  row-gap: 4px;
  margin-bottom: 0;
  background: #ADD8E6;
  padding: 14px 16px;
  border-radius: 6px;
}
 
.header-left {
  text-align: left;
  font-size: 26px;
  font-weight: 600;
}
 
.header-center {
  text-align: center;
  font-style: italic;
  color: #444;
}
 
.header-right {
  text-align: right;
  font-size: 13px;
  color: #666;
}
/* -------------------------------- */
 
h1 { font-size:26px; margin-bottom:20px; }
h2 { font-size:18px; border-bottom:1px solid #ddd; padding-bottom:6px; }
 
.card {
  background:#fff;
  border:1px solid #ddd;
  border-radius:6px;
  padding:18px 20px;
  margin-bottom:20px;
}
 
/* INPUT CARD ONLY */
.card.inputs {
  background:#ADD8E6;
  margin-bottom: 0;
  margin-top: 0;
  border-top: 0;
  border-top-left-radius: 0;
  border-top-right-radius: 0;
}

/* REMOVE SEAM BETWEEN HEADER & INPUT CARD */
.header-container {
  border-bottom-left-radius: 0;
  border-bottom-right-radius: 0;
}
/* REMOVE SEAM BETWEEN HEADER & INPUT CARD */
.header-container {
  border-bottom-left-radius: 0;
  border-bottom-right-radius: 0;
}

.card.inputs {
  border-top-left-radius: 0;
  border-top-right-radius: 0;
}
 
/* INPUTS SECTION TITLE */
.inputs-title {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 12px;
  color: #222;
  /*border-bottom: 1px solid rgba(0,0,0,0.1); */
  padding-bottom: 0;
}
 
.grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
 
label { font-size:13px; font-weight:600; display:block; margin-bottom:6px; }
 
/* ---------- TOOLTIP ---------- */
.label-with-tooltip { display:inline-flex; align-items:center; gap:6px; }
.tooltip-icon { position:relative; cursor:pointer; }
.tooltip-text {
  visibility:hidden; opacity:0; width:300px;
  background:#222; color:#fff; padding:10px;
  border-radius:6px; position:absolute; z-index:999;
  left:50%; top:100%; transform:translate(-50%,6px);
  transition:opacity .2s ease;
}
.tooltip-icon:hover .tooltip-text { visibility:visible; opacity:1; }
 
/* ---------- FORM ---------- */
input, select, button { width:100%; padding:8px 10px; font-size:14px; }
button {
  background:#2D92B3;
  color:#fff;
  border:none;
  border-radius:4px;
  cursor:pointer;
  margin-bottom: 16px;
}
button:hover { background:#183fb0; }
 
/* ---------- TABLE ---------- */
table { width:100%; border-collapse:collapse; font-size:14px; table-layout:fixed; }
th, td { padding:8px 6px; border-bottom:1px solid #eee; }
.right { text-align:right; }
.mono { font-family:ui-monospace, Menlo, Consolas, monospace; }
 
.highlight { font-size:32px; font-weight:700; margin:10px 0; }
.pos { color:#1a7f37; font-weight:600; }
.neg { color:#c92c2c; font-weight:600; }
.neu { font-weight:600; } /* inherits default black */ 
.disclaimer { font-size:12px; color:#666; text-align:center; margin-top:30px; }
 
/* ---------- STATE / COUNTY ---------- */
.subgrid {
  grid-column:1 / -1;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}
@media (max-width:600px){
  .subgrid { grid-template-columns:1fr; }
}

 /* ---------- RATE SENSITIVITY TABLE ---------- */
.rate-table th,
.rate-table td {
  width: 33.333%;
  text-align: center;
}

/* ---------- RATE / 3-COLUMN TABLES ---------- */
.rate-table th,
.rate-table td,
.three-col-33 th,
.three-col-33 td {
  width: 33.333%;
}
 
/* ---------- iPHONE OPTIMIZATION ---------- */
@media (max-width: 480px) {
 
  .grid {
    grid-template-columns: 1fr;
  }
 
  .header-left {
    font-size: 20px;
  }
 
  .highlight {
    font-size: 26px;
  }
 
  input, select, button {
    font-size: 16px; /* prevent iOS zoom */
  }
 
  table {
    display: block;
    overflow-x: auto;
    white-space: nowrap;
  }
}

/* FORCE MATCHING LEFT/RIGHT PADDING FOR INPUTS */
#maxPayment,
#maxCash {
  padding-right: 0;
}

</style>
</head>
 
<body>
<div class="container">
 
  <div class="header-container">
    <div class="header-left">Home Price Range Estimator</div>
    <div class="header-center"><h1><em>a tool for thought ...</em></h1></div>
    <div class="header-right">HP-Estimator ©2025</div>
  </div>
 
  <div class="card inputs">
    <div class="inputs-title">Inputs</div>
    <div class="grid">
 
      <div>
        <label class="label-with-tooltip">
          Maximum Monthly Housing Payment
          <span class="tooltip-icon">ⓘ
            <span class="tooltip-text">
              Some properties such as Condos, require Association Fees. If for example, you were interested in Condos and the average Association Fee is approx. $400 / mo. and you wanted a Maximum Housing Payment of $2,900, then you should enter $2,500 as your Maximum Housing Payment.
            </span>
          </span>
        </label>
        <input id="maxPayment" value="2,950">
      </div>
 
      <div>
        <label class="label-with-tooltip">
          Maximum funds available to use
          <span class="tooltip-icon">ⓘ
            <span class="tooltip-text">
              Although there are programs that offer less than 5% down payment options, they may have additional eligibility requirements, limitations or costs that are out of the scoop of this tool. This tool is defaulted to an assumption of 5% or more down payment on a conventional conforming loan.
            </span>
          </span>
        </label>
        <input id="maxCash" value="85,500">
      </div>

<!-- NEW TERM DROPDOWN -->
      <div>
  <label>Loan Term</label>
  <select id="term">
    <option value="360" selected>30 Years</option>
    <option value="180">15 Years</option>
  </select>
</div>
 
      <div class="subgrid">
        <div>
          <label>State</label>
          <select id="state"></select>
        </div>
        <div>
          <label>County</label>
          <select id="county" disabled></select>
        </div>
      </div>
 
    </div>
  </div>
 
  <button onclick="runCalculator()">Run Estimation</button>
</div>
 
<div class="container">
  <div id="output"></div>
</div>
 
<div class="disclaimer">The Home Price Range is designed to provide guidance and context, not as a precise determination.</div>
 
<script>
"use strict";

/* =========================================================
   V40.1-A — V32 STABLE ENGINE + SAFE OUTPUT
   ========================================================= */

/* ---------- FINANCIAL HELPERS ---------- */
function num(id){
  return Number(
    (document.getElementById(id)?.value || "0").replace(/,/g,"")
  ) || 0;
}
function fmt(n,d=0){
  return n.toLocaleString(undefined,{
    minimumFractionDigits:d,
    maximumFractionDigits:d
  });
}

/* ---------- CORE ENGINE (V32 LOGIC) ---------- */

let ACTIVE_FACTORS = null;
function calcV32(rate, TERM, maxPmt, maxCash){

  const r = rate / 12;
  const PIF = (r * Math.pow(1 + r, TERM)) / (Math.pow(1 + r, TERM) - 1);

  const MIN_DP = 0.05;
  const LBPMI = 0.0034;
  const HBPMI = 0.0115;

  let hp = 50000;
  let best = null;

  while(true){

    const cc = hp * ACTIVE_FACTORS.cc;
    const dp = maxCash - cc;

    if(dp < hp * MIN_DP) break;

    const la = hp - dp;
    const ltv = la / hp;

    const pi  = la * PIF;
    const tax = (hp * ACTIVE_FACTORS.tax) / 12;

    const hoi = (
      ACTIVE_FACTORS.hoiBaseAnnual *
      (Math.max(la, 0.8 * hp) / ACTIVE_FACTORS.hoiBaseCoverage)
    ) / 12;

    let pmi = 0;
    if(ltv > 0.80){
      const f = ltv >= 0.95
        ? HBPMI
        : LBPMI + (HBPMI - LBPMI) * (ltv - 0.80) / 0.15;
      pmi = (la * f) / 12;
    }

    const pmt = pi + tax + hoi + pmi;

    if(pmt <= maxPmt && (dp + cc) <= maxCash){
      best = { hp, la, dp, cc, ltv, pi, tax, hoi, pmi, pmt };
      hp += 1000;
    } else {
      break;
    }
  }

  return best;
}

/* ---------- MAIN RUN ---------- */
function runCalculator(){

  if(!ACTIVE_FACTORS){
    alert("Please select State and County");
    return;
  }

  const TERM = document.getElementById("term").value === "180" ? 180 : 360;
  const RATE = TERM === 180 ? FR15 : FR30;

  const maxPmt  = num("maxPayment");
  const maxCash = num("maxCash");

  const base = calcV32(RATE, TERM, maxPmt, maxCash);
  renderOutput(base, TERM, RATE);
}

/* ---------- OUTPUT ---------- */
function renderOutput(base, TERM, RATE){

  const output = document.getElementById("output");

  if(!base){
    output.innerHTML = `
      <div class="card">
        <h3>No Result</h3>
        <p>Your inputs do not support a purchase under the current constraints.</p>
      </div>
    `;
    return;
  }

  output.innerHTML = `
    <div class="card">
      <div class="highlight">
        Home Price Range &#8776; $${fmt(base.hp)}
      </div>
      <div>
        Loan Amount: <b>$${fmt(base.la)}</b><br>
        Term: ${TERM/12} years @ ${(RATE*100).toFixed(3)}%
      </div>
    </div>

    <div class="card">
      <h2>Monthly Payment Breakdown</h2>
      <table class="mono">
        <tr><td>P&amp;I</td><td class="right">$${fmt(base.pi,2)}</td></tr>
        <tr><td>Property Tax</td><td class="right">$${fmt(base.tax,2)}</td></tr>
        <tr><td>Homeowners Insurance</td><td class="right">$${fmt(base.hoi,2)}</td></tr>
        <tr><td>PMI</td><td class="right">$${fmt(base.pmi,2)}</td></tr>
        <tr><th>Total</th><th class="right">$${fmt(base.pmt,2)}</th></tr>
      </table>
    </div>

    <div class="card">
      <h2>Funds to Close</h2>
      <table class="mono">
        <tr><td>Down Payment</td><td class="right">$${fmt(base.dp)}</td></tr>
        <tr><td>Closing Costs</td><td class="right">$${fmt(base.cc)}</td></tr>
        <tr><th>Total Cash Required</th>
            <th class="right">$${fmt(base.dp + base.cc)}</th></tr>
      </table>
    </div>

    <p class="disclaimer">
      Entertainment purposes only. Estimates rely on assumptions and public data.
    </p>
  `;
}

/* ---------- AUTO INIT ---------- */
loadBaseRates();
</script>
