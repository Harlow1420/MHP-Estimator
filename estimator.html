<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Price Estimator V40.1</title>

<style>
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f6f7f8;
  color: #222;
  margin: 0;
  padding: 30px 0;
}
.container { max-width:1050px; margin:0 auto; padding:0 20px; }

.header-container {
  display: grid;
  grid-template-rows: auto auto auto;
  row-gap: 4px;
  background: #ADD8E6;
  padding: 14px 16px;
  border-radius: 6px 6px 0 0;
}
.header-left { font-size:26px; font-weight:600; }
.header-center { text-align:center; font-style:italic; }
.header-right { text-align:right; font-size:13px; color:#666; }

.card {
  background:#fff;
  border:1px solid #ddd;
  border-radius:6px;
  padding:18px 20px;
  margin-bottom:20px;
}
.card.inputs {
  background:#ADD8E6;
  border-top:0;
  border-radius:0 0 6px 6px;
}

.inputs-title { font-size:16px; font-weight:600; margin-bottom:12px; }

.grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
.subgrid { grid-column:1/-1; display:grid; grid-template-columns:1fr 1fr; gap:16px; }

label { font-size:13px; font-weight:600; margin-bottom:6px; display:block; }

input, select, button {
  width:100%;
  padding:8px 10px;
  font-size:14px;
}

button {
  background:#2D92B3;
  color:#fff;
  border:none;
  border-radius:4px;
  cursor:pointer;
  margin-bottom:16px;
}

.highlight { font-size:32px; font-weight:700; margin:10px 0; }
.mono { font-family:ui-monospace, Menlo, Consolas, monospace; }
.right { text-align:right; }

.disclaimer {
  font-size:12px;
  color:#666;
  text-align:center;
  margin-top:30px;
}

@media (max-width:480px){
  .grid { grid-template-columns:1fr; }
  input, select, button { font-size:16px; }
}
</style>
</head>

<body>

<div class="container">
  <div class="header-container">
    <div class="header-left">Home Price Range Estimator</div>
    <div class="header-center"><em>a tool for thought ...</em></div>
    <div class="header-right">HP-Estimator ©2025</div>
  </div>

  <div class="card inputs">
    <div class="inputs-title">Inputs</div>
    <div class="grid">

      <div>
        <label>Maximum Monthly Housing Payment</label>
        <input id="maxPayment" value="2950">
      </div>

      <div>
        <label>Maximum funds available to use</label>
        <input id="maxCash" value="86000">
      </div>

      <div>
        <label>Loan Term</label>
        <select id="term">
          <option value="360" selected>30 Years</option>
          <option value="180">15 Years</option>
        </select>
      </div>

      <div class="subgrid">
        <div>
          <label>State</label>
          <select id="state"></select>
        </div>
        <div>
          <label>County</label>
          <select id="county" disabled></select>
        </div>
      </div>

    </div>
  </div>

  <button onclick="runCalculator()">Run Estimation</button>
</div>

<div class="container">
  <div id="output"></div>
</div>

<div class="disclaimer">
  Entertainment purposes only. Estimates rely on assumptions and public data.
</div>

<script>
"use strict";

/* ---------- BASE RATES ---------- */
let FR30 = 0.065;
let FR15 = 0.058;

async function loadBaseRates(){
  try{
    const res = await fetch(
      "https://raw.githubusercontent.com/Harlow1420/MHP-Estimator/main/BaseRateAll.csv",
      { cache:"no-store" }
    );
    const rows = (await res.text()).trim().split("\n");
    const cols = rows[1].split(",");
    FR30 = parseFloat(cols[0]) || FR30;
    FR15 = parseFloat(cols[1]) || FR15;
  } catch(e){
    console.warn("Rate fetch failed, using defaults");
  }
}

/* ---------- ACTIVE FACTORS (SAFE DEFAULT) ---------- */
let ACTIVE_FACTORS = {
  tax: 0.0125,
  cc: 0.03,
  hoiBaseAnnual: 1200,
  hoiBaseCoverage: 300000
};

/* ---------- HELPERS ---------- */
function num(id){
  return Number(
    (document.getElementById(id)?.value || "0").replace(/,/g,"")
  ) || 0;
}
function fmt(n,d=0){
  return n.toLocaleString(undefined,{
    minimumFractionDigits:d,
    maximumFractionDigits:d
  });
}

/* ---------- CORE ENGINE (V32) ---------- */
function calcV32(rate, TERM, maxPmt, maxCash){

  const r = rate / 12;
  const PIF = (r * Math.pow(1 + r, TERM)) / (Math.pow(1 + r, TERM) - 1);

  const MIN_DP = 0.05;
  const LBPMI = 0.0034;
  const HBPMI = 0.0115;

  let hp = 50000;
  let best = null;

  while(true){

    const cc = hp * ACTIVE_FACTORS.cc;
    const dp = maxCash - cc;
    if(dp < hp * MIN_DP) break;

    const la = hp - dp;
    const ltv = la / hp;

    const pi  = la * PIF;
    const tax = (hp * ACTIVE_FACTORS.tax) / 12;

    const hoi = (
      ACTIVE_FACTORS.hoiBaseAnnual *
      (Math.max(la, 0.8 * hp) / ACTIVE_FACTORS.hoiBaseCoverage)
    ) / 12;

    let pmi = 0;
    if(ltv > 0.80){
      const f = ltv >= 0.95
        ? HBPMI
        : LBPMI + (HBPMI - LBPMI) * (ltv - 0.80) / 0.15;
      pmi = (la * f) / 12;
    }

    const pmt = pi + tax + hoi + pmi;

    if(pmt <= maxPmt && (dp + cc) <= maxCash){
      best = { hp, la, dp, cc, pi, tax, hoi, pmi, pmt };
      hp += 1000;
    } else break;
  }

  return best;
}

/* ---------- RUN ---------- */
function runCalculator(){

  const TERM = document.getElementById("term").value === "180" ? 180 : 360;
  const RATE = TERM === 180 ? FR15 : FR30;

  const base = calcV32(
    RATE,
    TERM,
    num("maxPayment"),
    num("maxCash")
  );

  const out = document.getElementById("output");
  if(!base){
    out.innerHTML = "<div class='card'>No result</div>";
    return;
  }

  out.innerHTML = `
    <div class="card">
      <div class="highlight">$${fmt(base.hp)}</div>
      <div>${TERM/12} yrs @ ${(RATE*100).toFixed(3)}%</div>
    </div>
  `;
}

/* ---------- INIT ---------- */
loadBaseRates();
</script>

</body>
</html>
