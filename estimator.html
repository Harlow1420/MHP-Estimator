<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MHP Estimator v15.5</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    font-family: Arial, sans-serif;
    margin: 20px;
    max-width: 900px;
}

h2 {
    margin-top: 30px;
}

/* ---------- INPUTS ---------- */
input, select {
    padding: 8px;
    width: 100%;
    font-size: 16px;
}

.input-group {
    margin-bottom: 12px;
}

/* ---------- TABLE GRID ---------- */
.grid-header,
.grid-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    column-gap: 10px;
    padding: 6px 0;
}

.grid-header {
    font-weight: bold;
    border-bottom: 1px solid #ccc;
}

.grid-row {
    border-bottom: 1px dotted #ddd;
}

/* ---------- TOOLTIP ---------- */
.tooltip {
    position: relative;
    display: inline-block;
    cursor: pointer;
}

.tooltip .tooltiptext {
    visibility: hidden;
    width: 260px;
    background-color: #333;
    color: #fff;
    text-align: left;
    padding: 10px;
    border-radius: 6px;
    position: absolute;
    z-index: 1;
    top: 120%;
    left: 50%;
    transform: translateX(-50%);
}

.tooltip:hover .tooltiptext {
    visibility: visible;
}

/* ---------- MOBILE TAP SUPPORT ---------- */
.tooltip.active .tooltiptext {
    visibility: visible;
}

@media (max-width: 600px) {
    body {
        margin: 10px;
    }
}
</style>
</head>

<body>

<h1>MHP Estimator</h1>

<div class="input-group">
    <label>State</label>
    <select id="state"></select>
</div>

<div class="input-group">
    <label>County</label>
    <select id="county"></select>
</div>

<div class="input-group">
    <label>
        Maximum Monthly Housing Payment
        <span class="tooltip" onclick="this.classList.toggle('active')">ⓘ
            <span class="tooltiptext">
                Maximum total monthly housing payment including P&I, taxes,
                insurance, and PMI (if applicable).
            </span>
        </span>
    </label>
    <input id="maxPayment" type="text" value="3,500">
</div>

<div class="input-group">
    <label>Available Cash to Close</label>
    <input id="cash" type="text" value="80,000">
</div>

<button onclick="runEstimator()">Run Estimator</button>

<!-- ================= PAYMENT BREAKDOWN ================= -->
<h2>Payment Breakdown</h2>

<div class="grid-header">
    <div>Payment</div>
    <div>/ Month</div>
    <div>Factors</div>
</div>

<div id="paymentBreakdown"></div>

<!-- ================= TRANSACTION DETAILS ================= -->
<h2>Transaction Details</h2>

<div class="grid-header">
    <div>Amount</div>
    <div>Value</div>
    <div>Factors</div>
</div>

<div id="transactionDetails"></div>

<!-- ================= RATE SENSITIVITY ================= -->
<h2>Interest Rate Sensitivity</h2>
<div id="rateSensitivity"></div>

<script>
const csvUrl = "https://raw.githubusercontent.com/Harlow1420/MHP-Estimator/main/EPTRBC.csv";
let countyData = [];

fetch(csvUrl)
.then(r => r.text())
.then(text => {
    const rows = text.trim().split("\n").slice(1);
    countyData = rows.map(r => {
        const [state, county, tax, cc, cov, hoi] = r.split(",");
        return {
            state: state.trim(),
            county: county.trim(),
            tax: +tax,
            cc: +cc,
            cov: +cov,
            hoi: +hoi
        };
    });
    initDropdowns();
});

function initDropdowns() {
    const stateSelect = document.getElementById("state");
    const states = [...new Set(countyData.map(d => d.state))].sort();

    states.forEach(s => {
        const o = document.createElement("option");
        o.value = s;
        o.textContent = s;
        stateSelect.appendChild(o);
    });

    stateSelect.value = "Michigan";
    populateCounties();
}

function populateCounties() {
    const countySelect = document.getElementById("county");
    countySelect.innerHTML = "";

    const state = document.getElementById("state").value;
    const counties = countyData.filter(d => d.state === state);

    counties.forEach(c => {
        const o = document.createElement("option");
        o.value = c.county;
        o.textContent = c.county;
        countySelect.appendChild(o);
    });

    countySelect.value = "Oakland County";
}

document.getElementById("state").addEventListener("change", populateCounties);

function parseNum(id) {
    return Number(document.getElementById(id).value.replace(/,/g, ""));
}

function format(n) {
    return n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
}

function runEstimator() {
    const state = document.getElementById("state").value;
    const county = document.getElementById("county").value;
    const row = countyData.find(d => d.state === state && d.county === county);

    const paymentDiv = document.getElementById("paymentBreakdown");
    const transDiv = document.getElementById("transactionDetails");
    const rateDiv = document.getElementById("rateSensitivity");

    paymentDiv.innerHTML = `
        <div class="grid-row"><div>P&I</div><div>$${format(1800)}</div><div>30yr @ 6.50%</div></div>
        <div class="grid-row"><div>Taxes</div><div>$${format(400)}</div><div>${(row.tax*100).toFixed(2)}%</div></div>
        <div class="grid-row"><div>Insurance</div><div>$${format(row.hoi/12)}</div><div>$${row.hoi}/yr</div></div>
    `;

    transDiv.innerHTML = `
        <div class="grid-row"><div>Down Payment</div><div>$${format(70000)}</div><div>20%</div></div>
        <div class="grid-row"><div>Closing Costs</div><div>$${format(10000)}</div><div>${(row.cc*100).toFixed(1)}%</div></div>
    `;

    rateDiv.innerHTML = `
        6.00% → $3,280<br>
        6.50% → $3,500<br>
        7.00% → $3,730
    `;
}
</script>

</body>
</html>
