<script>
"use strict";
 
// Constants
const MIN_DP = 0.05;
 
// 30-year PMI factors
const PMI30_LB = 0.0034;
const PMI30_HB = 0.0115;
 
// 15-year PMI factors
const PMI15_LB = 0.0025;
const PMI15_HB = 0.0080;
 
const RATE_STEP = 0.00125;
 
// Fallback BASE_RATE
let BASE_RATE = 0.0609;
let FR30_DEBUG = null;
let FR15_DEBUG = null;
 
// Formatting
function fmt(x, d=2) { return x.toLocaleString(undefined, {minimumFractionDigits:d, maximumFractionDigits:d}); }
function num(id) { return Number(document.getElementById(id).value.replace(/,/g,""))||0; }
["maxPayment","maxCash"].forEach(id=>{
  const el = document.getElementById(id);
  el.onfocus = ()=>el.value = el.value.replace(/,/g,"");
  el.onblur = ()=>el.value = Number(el.value).toLocaleString();
});

window.addEventListener("DOMContentLoaded", () => {
    const cityInput = document.getElementById("cityInput");
    const stateEl = document.getElementById("state");

    //  Start EMPTY and disabled
    cityInput.value = "";
    cityInput.placeholder = "";
    cityInput.disabled = true;

    // ENTER key still works
    cityInput.addEventListener("keydown", function(e) {
        if (e.key === "Enter") applyCityInput();
    });

    // Blur (click away)
    cityInput.addEventListener("blur", function() {
        if (stateEl.value) {
            applyCityInput();
        }
    });

    //  WHEN STATE CHANGES
    stateEl.addEventListener("change", function() {

        if (stateEl.value) {
            //  Enable + prompt user
            cityInput.disabled = false;
            cityInput.placeholder = "What city?";
        } else {
            //  Reset if cleared
            cityInput.value = "";
            cityInput.placeholder = "";
            cityInput.disabled = true;
        }

        // Keep your existing behavior
        if (cityInput.value.trim()) {
            applyCityInput();
        }
    });
});

// (Fix 2) removed alert forcing state selection

  // (Fix 2) removed alert forcing state selection
// -------------------------------
// Load BaseRateAll.csv (with retry)
// -------------------------------
async function fetchTextWithRetry(url, retries = 2, delay = 500) {
    for (let i = 0; i <= retries; i++) {
        try {
            const res = await fetch(url, { cache: "no-store" });
            if (!res.ok) throw new Error("HTTP " + res.status);
            return await res.text();
        } catch (err) {
            if (i === retries) throw err;
            await new Promise(r => setTimeout(r, delay));
        }
    }
}

async function loadBaseRateAll() {
    const URL = "https://raw.githubusercontent.com/Harlow1420/MHP-Estimator/main/BaseRateAll.csv";

    try {
        const text = await fetchTextWithRetry(URL, 2);

        const lines = text.trim().split("\n");

        if (lines.length >= 2) {
            const rateLine = lines[1].split(",").map(x => parseFloat(x));

            FR30_DEBUG = isNaN(rateLine[0]) ? null : rateLine[0];
            FR15_DEBUG = isNaN(rateLine[1]) ? null : rateLine[1];
        }

    } catch (err) {
        console.warn("BaseRateAll fetch failed:", err);
        FR30_DEBUG = null;
        FR15_DEBUG = null;
    }
}


// -------------------------------
// County CSV
// -------------------------------
const CSV_URL = "https://raw.githubusercontent.com/Harlow1420/MHP-Estimator/main/EPTRBC.csv";

let COUNTY_DATA = {};
let ACTIVE_FACTORS = null;

async function loadCSV() {
    try {
        const text = await fetchTextWithRetry(CSV_URL, 2);

        const rows = text.trim().split("\n").slice(1);

        rows.forEach(r => {
            if (!r) return;

            const cols = r.split(",");

            if (cols.length < 7) return; // guard against bad rows

            const [s, c, tax, cc, cov, hoi, oull] = cols;

            if (!s || !c) return;

            COUNTY_DATA[s] ??= {};
            COUNTY_DATA[s][c] = {
                tax: parseFloat(tax) || 0,
                cc: parseFloat(cc) || 0,
                hoiBaseCoverage: parseFloat(cov) || 0,
                hoiBaseAnnual: parseFloat(hoi) || 0,
                oull: oull ? parseFloat(oull) : null
            };
        });

        populateStates();

    } catch (err) {
        console.error("CSV load failed:", err);

        const el = document.getElementById("loadingOverlay");
        if (el) {
            el.innerHTML = `
                <div class="loaderBox">
                    <div class="loadingText">
                        Having trouble loading?<br><br>
                        This tool may run slower on some devices.<br><br>
                        <button onclick="location.reload()">Try Again</button>
                        <br><br>
                        <a href="/lite">Use Simplified Version</a>
                    </div>
                </div>
            `;
        }
    }
}

function populateStates(){
    const stateEl = document.getElementById("state");

    stateEl.innerHTML = "";

    //  Add placeholder option
    const placeholder = new Option("Choose a State", "");
    placeholder.disabled = true;
    placeholder.selected = true;
    stateEl.add(placeholder);

    Object.keys(COUNTY_DATA)
        .sort()
        .forEach(x => stateEl.add(new Option(x, x)));

    setTimeout(() => {
        if (document.getElementById("cityInput").value.trim()) {
            applyCityInput();
        }
    }, 150);
}
function populateCounties(){
    const stateEl = document.getElementById("state");
    const countyEl = document.getElementById("county");

    countyEl.innerHTML = "";

    if(!stateEl.value){
        countyEl.disabled = true;
        ACTIVE_FACTORS = null;
        return;
    }

    countyEl.disabled = false;

    Object.keys(COUNTY_DATA[stateEl.value])
        .sort()
        .forEach(x => countyEl.add(new Option(x,x)));

    countyEl.selectedIndex = -1;
    ACTIVE_FACTORS = null;
}

   //  CLEAN CONTINUATION
document.getElementById("state").onchange = () => {
    populateCounties();
};

document.getElementById("county").onchange = () => {
    const stateEl = document.getElementById("state");
    const countyEl = document.getElementById("county");
    ACTIVE_FACTORS = COUNTY_DATA[stateEl.value][countyEl.value];
};
 
document.addEventListener("click", function(e){
    const icon = e.target.closest(".tooltip-icon");
    document.querySelectorAll(".tooltip-text.show").forEach(t=>{
        if(!icon || !t.parentElement.contains(icon)) t.classList.remove("show");
    });
    if(icon){
        const tip = icon.querySelector(".tooltip-text");
        if(tip){ e.stopPropagation(); tip.classList.toggle("show"); }
    }
});
 
async function fetchWithRetry(url, attempts = 2) {
    for (let i = 0; i < attempts; i++) {
        try {
            const res = await fetch(url, { cache: "no-store" });
            if (!res.ok) throw new Error("HTTP " + res.status);
            return await res.text();
        } catch (err) {
            if (i === attempts - 1) throw err;
            console.warn("Retrying fetch:", url);
        }
    }
}
async function getCountyFromCity(city, state) {
    const apiKey = "8adbac99bb8c428fbc8b2621fccf00f5";

    const url = `https://api.opencagedata.com/geocode/v1/json?q=${encodeURIComponent(city + ", " + state)}&key=${apiKey}`;

    try {
        const res = await fetch(url);
        const data = await res.json();

        if (!data.results || !data.results.length) return null;

        let county = data.results[0].components.county || "";

        if (county && !county.toLowerCase().includes("county")) {
            county += " County";
        }

        return county;

    } catch (err) {
        console.warn("City → County lookup failed:", err);
        return null;
    }
}

async function applyCityInput() {
    const city = document.getElementById("cityInput").value.trim();
    const state = document.getElementById("state").value;

    if (!city || !state) return;

    const county = await getCountyFromCity(city, state);

    if (!county) {
        console.warn("City lookup failed, leaving manual selection.");
        return;
    }

    const countyEl = document.getElementById("county");
    let matched = false;

    for (let opt of countyEl.options) {
        if (opt.value.toLowerCase() === county.toLowerCase()) {
            countyEl.value = opt.value;
            matched = true;
            break;
        }
    }

    if (matched) {
        countyEl.dispatchEvent(new Event("change"));
        console.log(`Mapped: ${city} → ${county}`);
    } else {

        console.warn("County not found:", county);

        const countyEl = document.getElementById("county");
        countyEl.style.border = "1px solid #c92c2c";

        setTimeout(() => {
            countyEl.style.border = "";
        }, 2000);

    }
}
</script>
<script>
// Engine
function calc(rate, maxPmt, maxCash, term){
    const r = rate / 12;
    const PIF = (r * Math.pow(1+r,term)) / (Math.pow(1+r,term)-1);
 
    // Term-based PMI
    const LBPMI = (term === 180) ? PMI15_LB : PMI30_LB;
    const HBPMI = (term === 180) ? PMI15_HB : PMI30_HB;
 
    let hp = 50000, last = null;
 
    while(true){
        const cc = hp * ACTIVE_FACTORS.cc;
        const dp = maxCash - cc;
        if(dp < hp*MIN_DP) break;
 
        const la = Math.max(0, hp - dp);
        const ltv = la > 0 ? la / hp : 0;
 
        const pi = la * PIF;
        const tax = (hp * ACTIVE_FACTORS.tax)/12;
        const cov = Math.max(la, 0.8*hp);
        const hoi = (ACTIVE_FACTORS.hoiBaseAnnual*(cov/ACTIVE_FACTORS.hoiBaseCoverage))/12;
 
        let pmiF = ltv > 0.8
            ? (ltv >= 0.95 ? HBPMI : LBPMI + (HBPMI-LBPMI)*(ltv-0.8)/(0.95-0.8))
            : 0;
        const pmi = (la * pmiF)/12;
        const pmt = pi + tax + hoi + pmi;
 
        if (la === 0) {
            const pmtNoLoan = tax + hoi;
            if(pmtNoLoan <= maxPmt && dp + cc <= maxCash){
                last = {hp, la:0, dp, cc, ltv, pi:0, tax, hoi, pmi:0, pmt:pmtNoLoan, pmiF:0, cov};
                hp += 1000;
                continue;
            } else { break; }
        }
 
        if(pmt <= maxPmt && dp + cc <= maxCash){
            last={hp, la, dp, cc, ltv, pi, tax, hoi, pmi, pmt, pmiF, cov};
            hp += 1000;
        } else {
            // Refinement around 80% LTV
            if(last && Math.abs(last.ltv - 0.8) < 0.02){
                let best = last;
                for(let h = last.hp-2000; h <= last.hp+2000; h += 100){
                    if(h <= 0) continue;
                    const cc2 = h * ACTIVE_FACTORS.cc;
                    const dp2 = maxCash - cc2;
                    if(dp2 < h*MIN_DP) continue;
                    const la2 = h - dp2;
                    const ltv2 = la2 / h;
                    const pi2 = la2 * PIF;
                    const tax2 = (h * ACTIVE_FACTORS.tax)/12;
                    const cov2 = Math.max(la2, 0.8*h);
                    const hoi2 = (ACTIVE_FACTORS.hoiBaseAnnual*(cov2/ACTIVE_FACTORS.hoiBaseCoverage))/12;
                    let pmiF2 = ltv2 > 0.8 ? (ltv2>=0.95 ? HBPMI : LBPMI+(HBPMI-LBPMI)*(ltv2-0.8)/(0.95-0.8)) : 0;
                    const pmi2 = (la2*pmiF2)/12;
                    const pmt2 = pi2 + tax2 + hoi2 + pmi2;
                    if(pmt2 <= maxPmt && dp2 + cc2 <= maxCash){
                        best = {hp:h, la:la2, dp:dp2, cc:cc2, ltv:ltv2, pi:pi2, tax:tax2, hoi:hoi2, pmi:pmi2, pmt:pmt2, pmiF:pmiF2, cov:cov2};
                    }
                }
                last = best;
            }
            break;
        }
    }
 
    return last;
}
</script>
<script>
// Run Calculator
function runCalculator(){
    const term = parseInt(document.getElementById("term").value);
    const termLabel = `${term/12}YR Fixed`;
    let rateUsed = BASE_RATE;
    if(term===360 && FR30_DEBUG!==null) rateUsed = FR30_DEBUG;
    else if(term===180 && FR15_DEBUG!==null) rateUsed = FR15_DEBUG;
    console.log("Using rate:", rateUsed);
 
    const base = calc(rateUsed, num("maxPayment"), num("maxCash"), term);
    if(!base) return;
 
    const piFactor = base.pi / base.la;
 
    const miDrop =
  term -
  (Math.log(1 - ((base.hp * 0.8) * ((rateUsed / 12) / base.pi))) * -1) /
  Math.log(1 + rateUsed / 12);
 
const note1 = base.pmi > 0
  ? `Note: Based on these numbers, the PMI would be eligible to be cancelled after approximately ${Math.round(miDrop)} payment. `
  : "";
 
    // Stability Buffer Around 80% LTV
    const PMI_BUFFER_LOW  = 0.7925;
    const PMI_BUFFER_HIGH = 0.8075;
    const ltv = base.la / base.hp;
 
    const paymentFailSafe = (((base.pmt / (base.hp / 1000) * 2) + base.pmt - num("maxPayment")) * -1 > 0) && (ltv > 0.9);
    const outsidePmiCusp = (ltv < PMI_BUFFER_LOW || ltv > PMI_BUFFER_HIGH);
    const dpConstraint = paymentFailSafe && outsidePmiCusp;
 
    const note2 = dpConstraint
        ? `<p> Based on the inputs provided, the maximum home price would likely be a with less than 5% down payment.</p><p>This tool cannot calculate examples for less than 5% down payment, like FHA, VA, USDA Rural and First-Time Buyer Programs, because they have additional requirements and/or restrictions making them outside the scoop of this tool.</p><p>Or, try increase the input for available cash to purchase and resubmitting.</p>`
        : "";
 
    const note3 = (ACTIVE_FACTORS.oull && base.la > ACTIVE_FACTORS.oull)
        ? `<p>Based on thye inputs provided, the projected loan amount is greater than the conforming loan limit of $${ACTIVE_FACTORS.oull.toLocaleString()} for ${document.getElementById("county").value}, ${document.getElementById("state").value}.</p>
           <p>Jumbo Loans may have other requirements and/or restrictions and are out of scope of this tool.`
        : "";
 
const note4 = (base.la === 0)
  ? `Note: Based on your inputs, you have the cash available to pay for a higher priced home, but the equivalent of the effective monthly taxes and homeowner’s insurance on a higher priced home could exceed the monthly housing expense you inputted for your comfort level. `
  : "";
 
    const RATE_INCREMENT = 0.00125;
    const ROUNDED_BASE_RATE = Math.floor(rateUsed / RATE_INCREMENT) * RATE_INCREMENT;
    let sens = "";
    for(let r = ROUNDED_BASE_RATE-0.005; r <= ROUNDED_BASE_RATE+0.005; r += RATE_STEP){
        const v = calc(r, num("maxPayment"), num("maxCash"), term);
        if(!v) continue;
        const d = v.hp - base.hp;
        sens += `<tr>
            <td class="right">${(r*100).toFixed(3)}%</td>
            <td class="right ${d>=0?"pos":"neg"}">${d>=0?"+":"−"}$${Math.abs(d).toLocaleString()}</td>
            <td class="right">$${v.hp.toLocaleString()}</td>
        </tr>`;
    }
 
    document.getElementById("output").innerHTML = `
<div class="card">
  ${(note2 || note3) ? `
      ${note2 ? `<div class="neg" style="margin-bottom:8px;">${note2}</div>` : ""}
      ${note3 ? `<div class="neg">${note3}</div>` : ""}
  ` : `
      <div>Using an "example" rate of <b>${(rateUsed*100).toFixed(2)}%</b> on a ${termLabel} and a few assumptions, the upper limit of the</div>
      <div class="highlight">Home Price Range &#8776; $${base.hp.toLocaleString()}</div>
      <div>with a Loan Amount of <b>$${base.la.toLocaleString('en-US', {
  minimumFractionDigits: 0,
  maximumFractionDigits: 0
})}</b></div>
  `}
</div>${!(note2 || note3) ? `

<div class="card">
  <h2>Estimated Monthly Payment</h2>
  <div style="margin-bottom:10px;">
    Here’s how the estimated monthly housing payment is made up.
  </div>
<div id="rotateInlineNotice"></div>
<!--  KEEP ONLY ONE TABLE -->
<table id="paymentTable" class="mono three-col-33">
<!--  KEEP ONLY ONE TABLE -->
    <tr><th></th><th class="right">Monthly Estimate</th><th class="right">How it’s Calculated</th></tr>
    <tr><td><span class="label-with-tooltip">
      Principal &amp; Interest (P&amp;I)
      <span class="tooltip-icon">ⓘ
        <span class="tooltip-text">
          In this example, with the 1st payment, the loan balance would decrease by $${fmt(base.pi-(base.la*rateUsed/12))} from the principal portion of the payment. And in every scheduled payment thereafter, the principal portion of the payment would increase.
        </span>
      </span>
    </span></td><td class="right">$${fmt(base.pi)}</td><td class="right">${base.la > 0 ? `($${fmt(piFactor*1000,2)}/$1,000)` : ""}
</td></tr>

async function init() {

window.addEventListener("DOMContentLoaded", init);
function handleInlineRotateNotice() {
 const notice = document.getElementById("rotateInlineNotice");
 const table = document.getElementById("paymentTable");

 if (!notice || !table) return;

 const isMobile = /iPhone|Android/i.test(navigator.userAgent);
 const isPortrait = window.innerHeight > window.innerWidth;

  //  IMPROVED iPhone-safe detection
  const hasOverflow =
    table.scrollWidth > table.clientWidth + 5 ||
    table.getBoundingClientRect().width > window.innerWidth;

  if (isMobile && isPortrait && hasOverflow) {
    notice.style.display = "block";

    notice.innerHTML = "Rotate your device sideways → for a better view";

    setTimeout(() => {
      notice.style.display = "none";
    }, 5000);

  } else {
    notice.style.display = "none";
  }
}
// Run AFTER output renders
setTimeout(handleInlineRotateNotice, 300);

// Re-run on rotation
window.addEventListener("resize", handleInlineRotateNotice);

setTimeout(() => {
    const overlay = document.getElementById("loadingOverlay");
    if (overlay && overlay.style.display !== "none") {
        overlay.querySelector(".loadingText").innerHTML =
            "Still loading… just a moment longer.";
    }
}, 5000);                                                                                                                      
window.addEventListener("load", function () {
  const overlay = document.getElementById("loadingOverlay");
  if (overlay) overlay.style.display = "none";                                               
});
 
</script>
