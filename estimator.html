<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MHP Estimator V15.5</title>

<style>
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f6f7f8;
  color: #222;
  margin: 0;
  padding: 30px 0;
}

.container {
  max-width: 1050px;
  margin: 0 auto;
  padding: 0 20px;
}

h1 { font-size: 26px; margin-bottom: 20px; }
h2 {
  font-size: 18px;
  margin-bottom: 10px;
  border-bottom: 1px solid #ddd;
  padding-bottom: 6px;
}

.card {
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 6px;
  padding: 18px 20px;
  margin-bottom: 20px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}

label {
  font-size: 13px;
  font-weight: 600;
  display: block;
  margin-bottom: 6px;
}

/* ===== Tooltip styles ===== */
.label-with-tooltip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.tooltip-icon {
  position: relative;
  cursor: pointer;
  font-size: 13px;
  color: #555;
  user-select: none;
}

.tooltip-text {
  visibility: hidden;
  opacity: 0;
  width: 300px;
  background-color: #222;
  color: #fff;
  text-align: left;
  border-radius: 6px;
  padding: 10px;
  position: absolute;
  z-index: 999;
  bottom: 130%;
  left: 50%;
  transform: translateX(-50%);
  transition: opacity 0.2s ease;
  font-size: 12px;
  line-height: 1.4;
}

.tooltip-text::after {
  content: "";
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  border-width: 6px;
  border-style: solid;
  border-color: #222 transparent transparent transparent;
}

.tooltip-text.show {
  visibility: visible;
  opacity: 1;
}
/* ===== End tooltip styles ===== */

input, select, button {
  width: 100%;
  padding: 8px 10px;
  font-size: 14px;
}

button {
  background: #1f4fd8;
  color: #fff;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}

button:hover { background: #183fb0; }

.highlight {
  font-size: 32px;
  font-weight: 700;
  margin: 10px 0;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}

th, td {
  padding: 8px 6px;
  border-bottom: 1px solid #eee;
}

th { text-align: left; }
.right { text-align: right; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

.disclaimer {
  font-size: 12px;
  color: #666;
  text-align: center;
  margin-top: 30px;
}
</style>
</head>

<body>
<div class="container">

<h1>Maximum Home Price Estimator</h1>

<div class="card">
<h2>User Inputs</h2>

<div class="grid">
  <div>
    <label class="label-with-tooltip">
      Maximum Monthly Housing Payment
      <span class="tooltip-icon">ⓘ
        <span class="tooltip-text">
          If considering properties with HOA or Condo fees, subtract those
          from your desired housing payment before entering this amount.
        </span>
      </span>
    </label>
    <input id="maxPayment" value="4,000">
  </div>

  <div>
    <label class="label-with-tooltip">
      Maximum Funds Available to Use
      <span class="tooltip-icon">ⓘ
        <span class="tooltip-text">
          This estimator assumes a minimum 5% down payment on a conventional loan.
          Down payments below 5% are not supported.
        </span>
      </span>
    </label>
    <input id="maxCash" value="200,000">
  </div>

  <div>
    <label>State</label>
    <select id="state"></select>
  </div>

  <div>
    <label>County</label>
    <select id="county"></select>
  </div>
</div>

<br>
<button onclick="runCalculator()">Run Estimation</button>
</div>

<div id="output"></div>

<div class="disclaimer">
*** For entertainment purposes only ***
</div>

</div>

<script>
"use strict";

/* =====================
INPUT COMMA FORMATTING
===================== */
function formatNumber(val){
  if(!val) return "";
  const n = val.toString().replace(/,/g,"");
  if(isNaN(n)) return "";
  return Number(n).toLocaleString("en-US");
}

function getNumericValue(id){
  return Number(document.getElementById(id).value.replace(/,/g,"")) || 0;
}

["maxPayment","maxCash"].forEach(id=>{
  const el=document.getElementById(id);
  el.addEventListener("focus",()=>el.value=el.value.replace(/,/g,""));
  el.addEventListener("blur",()=>el.value=formatNumber(el.value));
});

/* =====================
TOOLTIP HANDLING
===================== */
document.addEventListener("click",e=>{
  document.querySelectorAll(".tooltip-icon").forEach(icon=>{
    const tip=icon.querySelector(".tooltip-text");
    icon.contains(e.target)
      ? tip.classList.toggle("show")
      : tip.classList.remove("show");
  });
});

/* =====================
ASSUMPTIONS
===================== */
const BASE_RATE = 0.0615;
const TERM_MONTHS = 360;
const MIN_DP_PCT = 0.05;

const LBPMI = 0.0034;
const HBPMI = 0.0115;

/* =====================
CSV DATA
===================== */
const CSV_URL =
"https://raw.githubusercontent.com/Harlow1420/MHP-Estimator/main/EPTRBC.csv";

let COUNTY_DATA = {};
let ACTIVE_FACTORS = null;

async function loadCSV(){
  const res = await fetch(CSV_URL);
  const text = await res.text();
  const rows = text.trim().split("\n").slice(1);

  rows.forEach(r=>{
    const [state, county, tax, cc, cov, hoi] = r.split(",");
    if(!COUNTY_DATA[state]) COUNTY_DATA[state]={};
    COUNTY_DATA[state][county]={
      tax:+tax,
      cc:+cc,
      hoiBaseCoverage:+cov,
      hoiBaseAnnual:+hoi
    };
  });
  populateStates();
}

/* =====================
DROPDOWNS
===================== */
function populateStates(){
  const s=document.getElementById("state");
  s.innerHTML="";
  Object.keys(COUNTY_DATA).sort().forEach(st=>{
    s.add(new Option(st,st));
  });
  if(COUNTY_DATA["Michigan"]) s.value="Michigan";
  populateCounties();
}

function populateCounties(){
  const state=document.getElementById("state").value;
  const c=document.getElementById("county");
  c.innerHTML="";
  Object.keys(COUNTY_DATA[state]).sort().forEach(cty=>{
    c.add(new Option(cty,cty));
  });
  if(COUNTY_DATA[state]["Oakland County"]) c.value="Oakland County";
  ACTIVE_FACTORS = COUNTY_DATA[state][c.value];
}

document.getElementById("state").addEventListener("change",populateCounties);
document.getElementById("county").addEventListener("change",()=>{
  ACTIVE_FACTORS = COUNTY_DATA[
    document.getElementById("state").value
  ][document.getElementById("county").value];
});

/* =====================
ENGINE
===================== */
function calculate(rate,maxPmt,maxCash){
  const r=rate/12;
  const PIF=(r*Math.pow(1+r,TERM_MONTHS))/(Math.pow(1+r,TERM_MONTHS)-1);

  let hp=50000,last=null;

  while(true){
    const cc=hp*ACTIVE_FACTORS.cc;
    const dp=maxCash-cc;
    if(dp<hp*MIN_DP_PCT) break;

    const la=hp-dp;
    const ltv=la/hp;

    const pi=la*PIF;
    const tax=(hp*ACTIVE_FACTORS.tax)/12;

    const cov=Math.max(la,0.8*hp);
    const hoi=(ACTIVE_FACTORS.hoiBaseAnnual*(cov/ACTIVE_FACTORS.hoiBaseCoverage))/12;

    let pmi=0,pmiF=0;
    if(ltv>0.8){
      pmiF=ltv>=0.95?HBPMI:LBPMI+(HBPMI-LBPMI)*(ltv-0.8001)/(0.95-0.8001);
      pmi=(la*pmiF)/12;
    }

    const pmt=pi+tax+hoi+pmi;
    if(pmt<=maxPmt && dp+cc<=maxCash){
      last={hp,la,dp,cc,ltv,pi,tax,hoi,pmi,pmt};
      hp+=1000;
    } else break;
  }
  return last;
}

/* =====================
RUN
===================== */
function runCalculator(){
  if(!ACTIVE_FACTORS) return;

  const base=calculate(
    BASE_RATE,
    getNumericValue("maxPayment"),
    getNumericValue("maxCash")
  );
  if(!base) return;

  document.getElementById("output").innerHTML=`
    <div class="card">
      <div class="highlight">$${base.hp.toLocaleString()}</div>
      <div>Loan Amount: <b>$${base.la.toLocaleString()}</b></div>
    </div>
  `;
}

loadCSV().then(runCalculator);
</script>
</body>
</html>
